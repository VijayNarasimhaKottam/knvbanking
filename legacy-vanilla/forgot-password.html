<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — KVN Bank</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/forgot-password.css">
  
  <!-- JS Foundation -->
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/router.js"></script>
  
  <!-- Page Specific JS -->
  <script src="js/forgot-password.js"></script>
</head>
<body class="public-layout">

  <div class="fp-layout">
    <div class="fp-container">
      
      <div class="fp-header">
        <a href="index.html" class="fp-logo">
          <img src="assets/logo.svg" alt="KVN Bank Logo">
          <span>KVN <span>Bank</span></span>
        </a>
        <h1 class="fp-title">Forgot Password</h1>
        <p class="fp-subtitle">Reset your NetBanking password securely in a few simple steps.</p>
      </div>

      <div class="fp-body">
        
        <!-- Step 1: Identify -->
        <div class="fp-step active" id="step-1">
          <div class="fp-icon-container">👤</div>
          <form id="fp-form-1" novalidate>
            <div class="form-group">
              <label for="username" class="form-label">Username / Customer ID <span class="required">*</span></label>
              <input type="text" id="username" class="form-control" placeholder="Enter your username" required data-testid="fp-username">
            </div>
            <button type="submit" id="btn-next-1" class="btn btn-primary w-full mt-4" data-testid="fp-next-1">Next Step →</button>
          </form>
        </div>

        <!-- Step 2: Verify -->
        <div class="fp-step" id="step-2">
          <div class="fp-icon-container">🛡️</div>
          <form id="fp-form-2" novalidate>
            
            <div class="sec-q-card">
              <div class="sec-q-label">Security Question</div>
              <div class="sec-q-text" id="display-sec-q">Loading...</div>
            </div>

            <div class="form-group">
              <label for="sec-a" class="form-label">Your Answer <span class="required">*</span></label>
              <input type="text" id="sec-a" class="form-control" placeholder="Enter answer" required data-testid="fp-seca">
            </div>

            <div class="form-group mt-6">
              <label class="form-label" style="text-align: center; display: block;">Enter OTP sent to <span id="masked-mobile"></span></label>
              <div class="otp-inputs">
                <input type="number" class="otp-input" maxlength="1" data-testid="fp-otp-1">
                <input type="number" class="otp-input" maxlength="1" data-testid="fp-otp-2">
                <input type="number" class="otp-input" maxlength="1" data-testid="fp-otp-3">
                <input type="number" class="otp-input" maxlength="1" data-testid="fp-otp-4">
                <input type="number" class="otp-input" maxlength="1" data-testid="fp-otp-5">
                <input type="number" class="otp-input" maxlength="1" data-testid="fp-otp-6">
              </div>
              <div class="otp-timer">
                Resend OTP in <span id="timer-count">0:60</span>
                <button type="button" id="btn-resend" class="otp-resend" disabled>Resend Now</button>
              </div>
            </div>

            <button type="submit" id="btn-next-2" class="btn btn-primary w-full mt-6" data-testid="fp-next-2">Verify & Proceed</button>
          </form>
        </div>

        <!-- Step 3: Reset Password -->
        <div class="fp-step" id="step-3">
          <div class="fp-icon-container">🔑</div>
          <form id="fp-form-3" novalidate>
            
            <div class="form-group">
              <label for="new-password" class="form-label">New Password <span class="required">*</span></label>
              <div class="password-wrapper">
                <input type="password" id="new-password" class="form-control" placeholder="Enter new password" required data-testid="fp-newpwd">
                <button type="button" class="password-toggle">👁️</button>
              </div>
              <div class="password-strength">
                <div class="password-strength-bar" id="pwd-strength-bar"></div>
              </div>
              <div class="password-strength-text" id="pwd-strength-text"></div>
            </div>

            <div class="form-group">
              <label for="confirm-new-password" class="form-label">Confirm New Password <span class="required">*</span></label>
              <div class="password-wrapper">
                <input type="password" id="confirm-new-password" class="form-control" placeholder="Confirm new password" required data-testid="fp-confirmpwd">
                <button type="button" class="password-toggle">👁️</button>
              </div>
            </div>

            <button type="submit" id="btn-reset" class="btn btn-primary w-full mt-6" data-testid="fp-submit">Reset Password</button>
          </form>
        </div>

        <!-- Step 4: Success -->
        <div class="fp-step fp-success" id="step-4" data-testid="fp-success">
          <div class="fp-icon-container" style="background: var(--color-success-light); color: var(--color-success); font-size: 32px;">✓</div>
          <h2 class="fp-title">Password Reset!</h2>
          <p class="fp-subtitle" style="margin-bottom: var(--space-8);">Your NetBanking password has been successfully reset. You can now login using your new password.</p>
          <a href="login.html" class="btn btn-primary w-full">Login to NetBanking</a>
        </div>

      </div>

      <div class="fp-footer">
        <a href="login.html">← Back to Login</a>
      </div>
      
    </div>
  </div>

</body>
</html>
