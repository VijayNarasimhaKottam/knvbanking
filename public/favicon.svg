<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#A88A33" />
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F3864" />
      <stop offset="100%" stop-color="#0A1628" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Hexagon Base -->
  <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="url(#secondaryGrad)" filter="url(#shadow)" />
  
  <!-- Inner Hexagon -->
  <polygon points="50,15 85,32 85,68 50,85 15,68 15,32" fill="none" stroke="url(#primaryGrad)" stroke-width="3" />
  
  <!-- Center elements forming 'K' and 'V' abstraction -->
  <path d="M 35 35 L 35 65" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <path d="M 65 35 L 35 50 L 65 65" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>